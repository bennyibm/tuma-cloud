name: ⚡ Deploy Backend API (Render)

on:
  push:
    paths:
      - 'apps/api/**'
      - 'render.yaml'
      - '.github/workflows/deploy-api.yml'
    branches:
      - main
      - prod/api
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🚀 Build & Trigger Render Webhook (apps/api)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/api/package.json'

      - name: Validate API Build
        run: |
          cd apps/api
          npm install
          npm run build

      - name: Trigger Render Deploy Hook
        if: success()
        run: |
          echo "Triggering Render Production Deployment Hook..."
          curl -f -X POST "${{ secrets.RENDER_API_DEPLOY_HOOK }}"
